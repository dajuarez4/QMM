[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmm"
version = "0.1.0"
description = "Clean quarkyonic and nuclear-matter workflow package."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29", "jupyterlab>=4.0"]

[project.scripts]
qmm = "qmm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
TOVsolver = ["data/*.dat"]
